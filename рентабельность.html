<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaspi Calc Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        body { touch-action: manipulation; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 font-sans min-h-screen flex items-start justify-center p-2">

    <div class="w-full max-w-sm mt-2 bg-[#1e293b] rounded-[2.5rem] shadow-2xl p-6 border border-slate-700/50">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-6 px-2">
            <h1 class="text-xl font-black text-blue-400 tracking-tighter">KASPI <span class="text-white">UNIT</span></h1>
            <div class="text-[10px] bg-slate-700 px-2 py-1 rounded-full text-slate-400 font-bold tracking-widest uppercase">Target 30%</div>
        </div>

        <!-- Main Inputs -->
        <div class="space-y-4">
            <div class="relative">
                <label class="text-[10px] font-bold text-slate-500 uppercase ml-4 mb-1 block">Цена Kaspi (₸)</label>
                <input type="number" id="kaspiPrice" inputmode="decimal" 
                    class="w-full bg-[#0f172a] border-2 border-slate-700 rounded-2xl p-4 text-2xl font-bold text-blue-400 focus:border-blue-500 outline-none" placeholder="0">
            </div>

            <div class="relative">
                <label class="text-[10px] font-bold text-slate-500 uppercase ml-4 mb-1 block">Цена 1688 (¥)</label>
                <input type="number" id="yuanPrice" inputmode="decimal" 
                    class="w-full bg-[#0f172a] border-2 border-slate-700 rounded-2xl p-4 text-2xl font-bold text-orange-400 focus:border-orange-500 outline-none" placeholder="0">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase ml-4 mb-1 block">Вес (кг)</label>
                    <input type="number" id="weight" step="0.1" inputmode="decimal" 
                        class="w-full bg-[#0f172a] border-2 border-slate-700 rounded-2xl p-4 text-xl font-bold focus:border-emerald-500 outline-none" placeholder="0.5">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 uppercase ml-4 mb-1 block">Доставка ($)</label>
                    <input type="number" id="shipRateUsd" value="3" inputmode="decimal" 
                        class="w-full bg-[#0f172a] border-2 border-slate-700 rounded-2xl p-4 text-xl font-bold focus:border-emerald-500 outline-none">
                </div>
            </div>

            <!-- Currency Settings (Collapsible-like) -->
            <div class="grid grid-cols-2 gap-3 bg-slate-800/50 p-3 rounded-2xl border border-slate-700/30">
                <div>
                    <label class="text-[9px] font-bold text-slate-500 uppercase mb-1 block">Курс ¥</label>
                    <input type="number" id="rateYuan" value="81" inputmode="decimal" class="w-full bg-transparent border-b border-slate-600 text-sm p-1 outline-none">
                </div>
                <div>
                    <label class="text-[9px] font-bold text-slate-500 uppercase mb-1 block">Курс $</label>
                    <input type="number" id="rateUsd" value="501" inputmode="decimal" class="w-full bg-transparent border-b border-slate-600 text-sm p-1 outline-none">
                </div>
            </div>
        </div>

        <!-- Result Card -->
        <div id="resultBox" class="mt-6 p-6 rounded-[2rem] bg-slate-900 transition-all duration-300 relative overflow-hidden">
            <div id="glow" class="absolute inset-0 opacity-10"></div>
            <div class="relative z-10 flex justify-between items-center text-center">
                <div class="flex-1">
                    <div class="text-[10px] font-bold opacity-60 uppercase mb-1">Прибыль</div>
                    <div id="profit" class="text-2xl font-black tracking-tight text-white">0 ₸</div>
                </div>
                <div class="w-[1px] h-10 bg-slate-700 mx-2"></div>
                <div class="flex-1">
                    <div class="text-[10px] font-bold opacity-60 uppercase mb-1">Маржа</div>
                    <div id="rent" class="text-2xl font-black text-white">0%</div>
                </div>
            </div>
        </div>

        <!-- Tiny Stats -->
        <div class="mt-4 flex justify-around text-[9px] font-bold text-slate-500 uppercase tracking-widest">
            <div id="infoShip">Доставка: 0 ₸</div>
            <div id="infoCost">Закуп: 0 ₸</div>
        </div>
    </div>

    <script>
        const ids = ['kaspiPrice', 'yuanPrice', 'weight', 'shipRateUsd', 'rateYuan', 'rateUsd'];
        const inputs = {};
        ids.forEach(id => inputs[id] = document.getElementById(id));

        function calculate() {
            const val = {};
            ids.forEach(id => val[id] = parseFloat(inputs[id].value) || 0);

            const shipCost = val.weight * (val.shipRateUsd * val.rateUsd);
            const itemCost = val.yuanPrice * val.rateYuan;
            const fullExpense = itemCost + shipCost + (val.kaspiPrice * 0.34);
            
            const netProfit = val.kaspiPrice - fullExpense;
            const margin = val.kaspiPrice > 0 ? (netProfit / val.kaspiPrice) * 100 : 0;

            // DOM Updates
            document.getElementById('profit').innerText = Math.round(netProfit).toLocaleString() + ' ₸';
            document.getElementById('rent').innerText = Math.round(margin) + '%';
            document.getElementById('infoShip').innerText = 'Доставка: ' + Math.round(shipCost) + ' ₸';
            document.getElementById('infoCost').innerText = 'Закуп: ' + Math.round(itemCost) + ' ₸';

            const box = document.getElementById('resultBox');
            const glow = document.getElementById('glow');
            
            // Mobile Haptic-like visual feedback
            if (val.kaspiPrice > 0) {
                if (margin >= 30) {
                    box.style.backgroundColor = '#059669'; // Emerald 600
                    glow.style.backgroundColor = '#ffffff';
                } else if (margin >= 15) {
                    box.style.backgroundColor = '#d97706'; // Amber 600
                    glow.style.backgroundColor = 'transparent';
                } else {
                    box.style.backgroundColor = '#dc2626'; // Red 600
                    glow.style.backgroundColor = 'transparent';
                }
            } else {
                box.style.backgroundColor = '#0f172a';
            }
        }

        ids.forEach(id => inputs[id].addEventListener('input', calculate));
    </script>
</body>
</html>
